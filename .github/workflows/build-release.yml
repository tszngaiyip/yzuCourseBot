name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'  # 當推送以 v 開頭的 tag 時觸發（例如 v1.0.0）

jobs:
  build:
    strategy:
      fail-fast: false  # 一個平台失敗不影響另一個
      matrix:
        include:
          - os: windows-latest
            artifact_name: YZUCourseBot-Windows
            spec_file: yzuCourseBot.spec
          - os: macos-26              # Apple Silicon (arm64)
            artifact_name: YZUCourseBot-macOS-AppleSilicon
            spec_file: yzuCourseBot_macos.spec
          - os: macos-26-intel        # Intel (x86_64)
            artifact_name: YZUCourseBot-macOS-Intel
            spec_file: yzuCourseBot_macos.spec

    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Sync version
      run: python scripts/update_version.py ${{ github.ref_name }}
        
    - name: Build with PyInstaller
      run: |
        cd GUI
        pyinstaller ${{ matrix.spec_file }}

    # === Windows 專用步驟 ===
    - name: Verify executable (Windows)
      if: runner.os == 'Windows'
      run: |
        if (-not (Test-Path "GUI\dist\元智選課機器人.exe")) {
          echo "Error: Executable not found!"
          exit 1
        }
        echo "Executable found successfully"
        
    - name: Create ZIP archive (Windows)
      if: runner.os == 'Windows'
      run: |
        cd GUI\dist
        powershell Compress-Archive -Path "元智選課機器人.exe" -DestinationPath "${{ matrix.artifact_name }}-${{ github.ref_name }}.zip"
        dir

    # === macOS 專用步驟 ===
    - name: Verify app bundle (macOS)
      if: runner.os == 'macOS'
      run: |
        if [ ! -d "GUI/dist/元智選課機器人.app" ]; then
          echo "Error: App bundle not found!"
          exit 1
        fi
        echo "App bundle found successfully"
        ls -la GUI/dist/

    - name: Smoke test app bundle (macOS)
      if: runner.os == 'macOS'
      run: |
        # 定義二進位檔路徑
        APP_BINARY="GUI/dist/元智選課機器人.app/Contents/MacOS/yzuCourseBot"
        chmod +x "$APP_BINARY"
        
        echo "🚀 正在啟動冒煙測試（預計執行 10 秒）..."
        
        # 使用背景模式執行，並記錄 PID
        "$APP_BINARY" &
        APP_PID=$!
        
        # 等待 10 秒
        for i in {1..10}; do
          sleep 1
          if ! kill -0 $APP_PID 2>/dev/null; then
            # 如果進程已不存在，檢查其退出代碼
            wait $APP_PID
            EXIT_CODE=$?
            echo "❌ 程式在 $i 秒後崩潰，退出代碼：$EXIT_CODE"
            exit 1
          fi
          echo "... $i 秒"
        done
        
        # 如果 10 秒後還在運行，視為庫載入成功
        echo "✅ 10 秒測試通過，正在關閉程式..."
        kill $APP_PID
        echo "✨ 冒煙測試成功！應用程式可以正常初始化載入庫。"

    - name: Create ZIP archive (macOS)
      if: runner.os == 'macOS'
      run: |
        cd GUI/dist
        # 1. 恢復 Flet 在 datas 遺失的執行權限
        find "元智選課機器人.app" -name "flet_desktop*" -exec chmod +x {} \;
        find "元智選課機器人.app" -name "flet_cli*" -exec chmod +x {} \;
        
        # 2. 強制對整個 .app 進行深度的 ad-hoc 簽名，解決 Gatekeeper 阻擋問題
        codesign --force --deep -s - "元智選課機器人.app"
        
        # 3. 使用 ditto 保留 symlinks 建立壓縮檔
        ditto -c -k --sequesterRsrc --keepParent "元智選課機器人.app" "${{ matrix.artifact_name }}-${{ github.ref_name }}.zip"
        ls -la

    # === 共用步驟 ===
    - name: Upload build warnings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-warnings-${{ matrix.artifact_name }}
        path: GUI/build/*/warn-*.txt
        if-no-files-found: warn

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: GUI/dist/${{ matrix.artifact_name }}-${{ github.ref_name }}.zip

  build_android:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-global-${{ hashFiles('mobile_app/buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-global

    - name: Cache Buildozer local directory
      uses: actions/cache@v4
      with:
        path: mobile_app/.buildozer
        key: ${{ runner.os }}-buildozer-local-${{ hashFiles('mobile_app/buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-local

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Sync version
      run: python scripts/update_version.py ${{ github.ref_name }}

    - name: Install Buildozer and system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git ccache libffi-dev libssl-dev \
          libltdl-dev liblzma-dev python3-dev zip unzip zlib1g-dev \
          cmake automake autoconf libtool pkg-config \
          libncurses-dev libtinfo6
        pip install --upgrade buildozer cython virtualenv

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Build with Buildozer
      run: |
        cd mobile_app
        buildozer android debug

    - name: Rename APK
      run: |
        cd mobile_app/bin
        mv *.apk YZUCourseBot-Android-${{ github.ref_name }}.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: yzucoursebot-apk
        path: mobile_app/bin/YZUCourseBot-Android-${{ github.ref_name }}.apk

  build_ios:
    runs-on: macos-26  # Apple Silicon (arm64)
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Sync version
      run: python scripts/update_version.py ${{ github.ref_name }}
        
    - name: Cache Kivy-iOS Build Directory
      uses: actions/cache@v4
      with:
        path: |
          .cache
          dist
          build
        key: ${{ runner.os }}-kivy-ios-${{ hashFiles('.github/workflows/build-release.yml') }}
        restore-keys: |
          ${{ runner.os }}-kivy-ios-
        
    - name: Install build dependencies
      run: |
        python -m pip install --no-cache-dir --upgrade pip
        # kivy-ios 目前對 Cython 版本較敏感，通常需指定舊版
        pip install --no-cache-dir "Cython<3.0.0" 
        pip install --no-cache-dir kivy-ios
        
    - name: Install system dependencies (brew)
      run: |
        for pkg in autoconf automake libtool pkg-config; do
          brew list $pkg >/dev/null 2>&1 || brew install $pkg
        done
        
    - name: Build Kivy Toolchain (Native Recipes)
      run: |
        # Kivy-iOS 需要編譯底層依賴庫 (C/C++ Extensions)
        toolchain build python3 kivy
        toolchain build hostopenssl openssl
        toolchain build numpy
        toolchain build pillow materialyoucolor
        
    - name: Install Pure Python Dependencies
      run: |
        # 其他純 Python 的依賴套件可以直接透過 toolchain pip 安裝
        toolchain pip install --no-deps https://github.com/kivymd/KivyMD/archive/master.zip
        toolchain pip install asyncgui asynckivy
        toolchain pip install --no-deps materialshapes
        toolchain pip install beautifulsoup4 typing-extensions soupsieve oscpy plyer requests
        
    - name: Create Xcode Project
      run: |
        # 將 mobile_app 目錄下的原始碼封裝成 Xcode 專案
        toolchain create yzucoursebot mobile_app
        
    - name: Inject Custom App Icon
      run: |
        # 尋找由 kivy-ios 產生的 AppIcon.appiconset 資料夾
        ICON_DIR=$(find yzucoursebot-ios -type d -name "AppIcon.appiconset")
        if [ -n "$ICON_DIR" ]; then
          # 刪除預設的圖示內容
          rm -rf "$ICON_DIR"/*
          
          # 將我們製作好的正方形藍底 iOS 圖示複製進去並更名為 icon.png
          cp pic/icon_ios.png "$ICON_DIR/icon.png"
          
          # 寫入支援 iOS「單一尺寸 (Single Size)」特性的 Contents.json
          echo '{
            "images" : [
              {
                "filename" : "icon.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }' > "$ICON_DIR/Contents.json"
          echo "App Icon successfully injected."
        else
          echo "Error: AppIcon.appiconset directory not found!"
          exit 1
        fi

    - name: Inject Custom Launch Screen
      run: |
        # 尋找所有的 Images.xcassets 目錄
        find yzucoursebot-ios -type d -name "Images.xcassets" | while read xcassets; do
          # 建立 presplash.imageset，讓 LaunchScreen.storyboard 可以透過 name="presplash" 找到圖片
          mkdir -p "$xcassets/presplash.imageset"
          cp pic/presplash.png "$xcassets/presplash.imageset/presplash.png"
          echo '{
            "images" : [
              {
                "filename" : "presplash.png",
                "idiom" : "universal",
                "scale" : "1x"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }' > "$xcassets/presplash.imageset/Contents.json"
          
          # 尋找除了 AppIcon 以外的 .imageset 目錄，通常就是啟動畫面 (例如 kivy-splash.imageset)
          find "$xcassets" -type d -name "*.imageset" | grep -v "presplash.imageset" | while read imageset; do
            # 刪除裡面舊的圖片
            rm -f "$imageset"/*.png
            # 放入我們的 presplash.png
            cp pic/presplash.png "$imageset/presplash.png"
            # 覆寫 Contents.json
            echo '{
              "images" : [
                {
                  "filename" : "presplash.png",
                  "idiom" : "universal",
                  "scale" : "1x"
                }
              ],
              "info" : {
                "author" : "xcode",
                "version" : 1
              }
            }' > "$imageset/Contents.json"
          done
          
          # 處理舊版的 LaunchImage.launchimage
          find "$xcassets" -type d -name "*.launchimage" | while read launchimage; do
            find "$launchimage" -type f -name "*.png" | while read img; do
              cp pic/presplash.png "$img"
            done
          done
        done
        
        # 替換舊版 Xcode 專案根目錄可能存在的 Default.png 系列
        find yzucoursebot-ios -type f -name "Default*.png" | while read img; do
          cp pic/presplash.png "$img"
        done
        
        # 替換新版 kivy-ios Launch Screen.storyboard 預設引用的圖片 (icon.png)
        if [ -f "yzucoursebot-ios/icon.png" ]; then
          cp pic/presplash.png "yzucoursebot-ios/icon.png"
        fi
        
        # 替換 kivy-ios 生成的預設 Launch Screen.storyboard 為我們自訂的版本
        find yzucoursebot-ios -type f -name "Launch Screen.storyboard" -exec cp mobile_app/ios_setup/LaunchScreen.storyboard {} \;
        
        echo "Launch Screen successfully injected."
        
    - name: Inject Background Audio and App Name to Info.plist
      run: |
        # 透過 PlistBuddy 注入 UIBackgroundModes (audio)，欺騙 iOS 我們是音樂播放器
        PLIST_PATH="yzucoursebot-ios/yzucoursebot-Info.plist"
        /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST_PATH"
        /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST_PATH"
        
        # 注入 CFBundleDisplayName 與 CFBundleName，讓手機桌面顯示大寫名稱
        /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName YZUCourseBot" "$PLIST_PATH" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string YZUCourseBot" "$PLIST_PATH"
        /usr/libexec/PlistBuddy -c "Set :CFBundleName YZUCourseBot" "$PLIST_PATH" || /usr/libexec/PlistBuddy -c "Add :CFBundleName string YZUCourseBot" "$PLIST_PATH"
        
    - name: Build Un-signed IPA
      run: |
        cd yzucoursebot-ios
        # 關閉所有的簽章要求，直接編譯 Release 版本，並強制指定 Deployment Target 為 12.0
        xcodebuild -project yzucoursebot.xcodeproj -scheme yzucoursebot -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO SYMROOT=build IPHONEOS_DEPLOYMENT_TARGET=12.0 build
        
        # 手動將編譯出的 .app 封裝為 AltStore 相容的 Payload/.ipa 格式
        mkdir -p Payload
        cp -R build/Release-iphoneos/yzucoursebot.app Payload/
        zip -r ../YZUCourseBot-iOS-${{ github.ref_name }}.ipa Payload
        
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: yzucoursebot-ios-ipa
        path: YZUCourseBot-iOS-${{ github.ref_name }}.ipa

  release:
    needs: [build, build_android, build_ios]
    runs-on: ubuntu-latest
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        
    - name: List downloaded files
      run: |
        find artifacts -type f -name "*.zip"
        find artifacts -type f -name "*.apk"
        find artifacts -type f -name "*.ipa"

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/YZUCourseBot-Windows/*.zip
          artifacts/YZUCourseBot-macOS-AppleSilicon/*.zip
          artifacts/YZUCourseBot-macOS-Intel/*.zip
          artifacts/yzucoursebot-apk/*.apk
          artifacts/yzucoursebot-ios-ipa/*.ipa
        body: |
          ## 元智大學選課機器人 ${{ github.ref_name }}
          
          此發布版本包含了**電腦版**與**手機版 (Android/iOS)**。
          
          ### 📥 下載說明
          
          | 平台 | 下載檔案 | 適用機型 |
          |------|----------|----------|
          | **Windows** | `YZUCourseBot-Windows-${{ github.ref_name }}.zip` | 所有 Windows 電腦 |
          | **macOS (Apple Silicon)** | `YZUCourseBot-macOS-AppleSilicon-${{ github.ref_name }}.zip` | M1/M2/M3/M4 晶片的 Mac |
          | **macOS (Intel)** | `YZUCourseBot-macOS-Intel-${{ github.ref_name }}.zip` | 2020 年前的 Intel 晶片 Mac |
          | **Android** | `YZUCourseBot-Android-${{ github.ref_name }}.apk` | Android 手機 |
          | **iOS** | `YZUCourseBot-iOS-${{ github.ref_name }}.ipa` | iPhone / iPad (需側載) |
          
          ---
          
          ### 🪟 Windows 使用方式
          1. 下載 `YZUCourseBot-Windows-${{ github.ref_name }}.zip`
          2. 解壓縮 ZIP 檔案
          3. 雙擊執行 `元智選課機器人.exe`
          4. 在圖形介面中輸入帳號、密碼、課程清單
          5. 點擊「開始選課」按鈕
          
          ### 🍎 macOS 使用方式
          1. 確認您的 Mac 晶片類型：點擊左上角  → 「關於這台 Mac」
             - 顯示 **Apple M1/M2/M3/M4** → 下載 `AppleSilicon` 版本
             - 顯示 **Intel** 處理器 → 下載 `Intel` 版本
          2. 下載對應版本的 ZIP 檔案並解壓縮
          3. **首次開啟**：右鍵點擊 `元智選課機器人.app` → 選擇「打開」→ 在彈出的對話框中點擊「打開」
          4. 在圖形介面中輸入帳號、密碼、課程清單
          5. 點擊「開始選課」按鈕
          
          > ⚠️ **macOS 安全提示**：由於此應用程式未經 Apple 簽署，首次開啟時 macOS 會顯示安全警告。
          > 請使用「右鍵 → 打開」的方式來繞過此限制。
          > 或者在終端機執行：`xattr -rd com.apple.quarantine 元智選課機器人.app`
          
          ### 課程清單格式
          每行一個課程，格式：`系所代碼,課程代碼`
          
          範例：
          ```
          312,EEB219A
          304,CS201B
          ```
          
          ### 📱 Android 使用方式
          1. 下載 APK 檔案
          2. 在手機上開啟該檔案並允許「安裝未知來源應用程式」
          3. 安裝完成後開啟「YZUCourseBot」
          4. 填寫帳號密碼與課程清單，點擊「開始選課」
          
          ### 📱 iOS 使用方式 (側載)
          1. iOS 版本目前需透過側載 (Sideload) 安裝。
          2. 下載 `.ipa` 檔案至手機。
          3. 透過 [iLoader](https://github.com/nab138/iloader) 等工具將其安裝至您的 iPhone/iPad。
          4. 安裝完成後需至「設定」>「一般」>「VPN 與裝置管理」信任您的開發者憑證。
          5. 填寫帳號密碼與課程清單，點擊「開始選課」。

          ### ⚠️ 注意事項
          - **Windows**：請確保解壓縮後再執行，不要直接在壓縮檔內執行
          - **Windows**：部分防毒軟體可能會誤報，請加入信任清單
          - **macOS**：需要 macOS 12 (Monterey) 或更新版本
          - **macOS**：首次開啟請務必使用「右鍵 → 打開」
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
