name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Buildozer and system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev libssl-dev libltdl-dev liblzma-dev python3-dev zip unzip zlib1g-dev default-jdk autoconf libtool pkg-config
        pip install --upgrade buildozer cython virtualenv

    - name: Build with Buildozer
      run: |
        cd mobile_app
        # 自動同意授權條款並編譯 APK
        yes | buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: yzucoursebot-apk
        path: mobile_app/bin/*.apk
